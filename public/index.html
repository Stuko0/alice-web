<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alice Agent — Your AI teammate, on your machine</title>
  <meta name="description" content="Alice Agent is an open-source AI agent that runs locally, remembers context, and handles code, tasks, and creativity without sending your workflow to the cloud." />
  <link rel="canonical" href="https://alice-agent.stuko.dev/en/" />
  <meta name="robots" content="index, follow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    body {
      background: #232136;
      color: #e0def4;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .loader {
      width: 32px;
      height: 32px;
      border: 3px solid #393552;
      border-top-color: #c4a7e7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .container {
      display: flex;
      align-items: center;
      gap: 0;
      background: #2a273f;
      padding: 24px 32px;
      border-radius: 16px;
      border: 1px solid #393552;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loader"></div>
    <p>Redirecting to <span id="lang-display">the right language</span>…</p>
  </div>
  <noscript>
    <p>Alice Agent — open-source AI agent that runs locally, remembers context, and handles code, tasks, and creativity.</p>
    <ul>
      <li><a href="/en/">English</a></li>
      <li><a href="/es/">Español</a></li>
      <li><a href="/it/">Italiano</a></li>
    </ul>
  </noscript>
  <script>
    (function() {
      var langs = navigator.languages || [navigator.language];
      var supported = ['en', 'es', 'it'];
      var lang = 'en';
      for (var i = 0; i < langs.length; i++) {
        var code = langs[i].slice(0, 2);
        if (supported.indexOf(code) !== -1) { lang = code; break; }
      }
      document.getElementById('lang-display').textContent = lang.toUpperCase();
      window.location.href = lang + '/';
    })();
  </script>
</body>
</html>
