name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Documentation site (Docusaurus) lives in the alice-agent repo and is
      # published under /docs/ of this same domain. scripts/docs-upstream.patch
      # carries the fixes needed to build it (stale sidebar ids, redirect
      # config, trailingSlash, userStories.json); drop it once those land
      # upstream in Stuko0/alice-agent.
      - uses: actions/checkout@v4
        with:
          repository: Stuko0/alice-agent
          ref: main
          path: alice-agent

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            alice-agent/website/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install site dependencies
        run: npm ci

      - name: Install docs dependencies
        run: npm ci
        working-directory: alice-agent/website

      - name: Install python deps for docs extraction
        run: pip install pyyaml==6.0.3

      - name: Apply docs build fixes
        run: git -C alice-agent apply "$GITHUB_WORKSPACE/scripts/docs-upstream.patch"

      - name: Extract skill metadata for the docs site
        working-directory: alice-agent/website
        run: |
          python3 scripts/extract-skills.py
          python3 scripts/generate-skill-docs.py

      - name: Strip emojis from docs content
        run: python3 scripts/strip-emojis.py alice-agent/website/docs alice-agent/website/i18n

      - name: Build docs (Docusaurus, en + zh-Hans)
        run: npm run build
        working-directory: alice-agent/website

      - name: Build landing (Astro)
        run: npm run build

      - name: Publish docs under dist/docs
        run: cp -R alice-agent/website/build dist/docs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
